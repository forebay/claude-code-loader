name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      extra_repositories: |
        forebay/host siblings/host 50aab349cfb9d217fbcfedf7d60617e2fdcef8e3
        weivel/model siblings/host/siblings/model 606988fb178b04d3f53835e6d982c09f31081ef1
        weivel/typescript siblings/host/siblings/typescript 46bf872abbfcfe164294a9b3daa40fa0c26fff77
        spisor/library siblings/host/siblings/library 379dcd73da27f0abfa4d9515f220655be65c4ce7
        forebay/library siblings/host/siblings/forebay-library 0f882ba70e265bfb399e6e90ec47e504a5812676
        forebay/anthropic-translator siblings/anthropic-translator c82f45883876b594854cd3b8417b00691a6f8aa4
        forebay/claude-code-proxy siblings/claude-code-proxy a95560893264bc7c3cac8a4de207e4e6a8e1bc2d
        forebay/provider-stub siblings/provider-stub 16014a6b2687afa27e33bf5cdf807ba456d6af1c
        forebay/claude-code-provider siblings/claude-code-provider 2faedbcf7901c421ad333c0ff96e53a2c3481aa6
      node_install: npm ci --prefix siblings/host/siblings/model && npm ci --prefix siblings/host/siblings/typescript && npm ci --prefix siblings/host && npm install && npm install --prefix siblings/claude-code --no-save @anthropic-ai/claude-code@2.1.318
      node_build: cmake -S siblings/host/siblings/library -B siblings/host/siblings/library/build && cmake --build siblings/host/siblings/library/build --config Release && cmake -S siblings/host/siblings/forebay-library -B siblings/host/siblings/forebay-library/build && cmake --build siblings/host/siblings/forebay-library/build --config Release --target apps && npm run build --prefix siblings/host/siblings/typescript && npm run build --prefix siblings/host && npx tsc -p siblings/anthropic-translator/tsconfig.build.json && npm run build
      node_test: npm test
      cmake_configure: '-S siblings/host/siblings/library -B siblings/host/siblings/library/build'
      cmake_build: '--build siblings/host/siblings/library/build --config Release'
      cmake_test: ''
