name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      node_install: npm ci --prefix siblings/host/siblings/model && npm ci --prefix siblings/host/siblings/typescript && npm ci --prefix siblings/host && npm install && npm install --prefix siblings/claude-code --no-save @anthropic-ai/claude-code@2.1.318
      node_build: cmake -S siblings/host/siblings/library -B siblings/host/siblings/library/build && cmake --build siblings/host/siblings/library/build --config Release && cmake -S siblings/host/siblings/forebay-library -B siblings/host/siblings/forebay-library/build && cmake --build siblings/host/siblings/forebay-library/build --config Release --target forebay_library && npm run build --prefix siblings/host/siblings/typescript && npm run build --prefix siblings/host && npx tsc -p siblings/anthropic-translator/tsconfig.build.json && npm run build
      node_test: npm test
      cmake_configure: '-S siblings/host/siblings/library -B siblings/host/siblings/library/build'
      cmake_build: '--build siblings/host/siblings/library/build --config Release'
      cmake_test: ''
